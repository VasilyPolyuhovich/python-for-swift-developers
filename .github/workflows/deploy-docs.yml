name: Deploy docs

on:
  push:
    branches: [develop]
    paths:
      - "**.md"
      - "mkdocs.yml"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch: {}

permissions:
  contents: write          # потрібно, щоб пушити гілку gh-pages

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # gh-deploy потребує повної історії

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build & deploy to gh-pages
        run: |
          uvx --from mkdocs --with mkdocs-material \
            mkdocs gh-deploy --force -f mkdocs.yml \
            --message "Deploy docs {sha} via CI"
